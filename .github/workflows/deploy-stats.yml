name: Deploy Stats Website

on:
  push:
    branches: [main, master, claude/initialize-repo-01NEJaF3TxJTeFxd3rcPuzvt]
    paths:
      - 'website/**'
  workflow_dispatch:

# Sets permissions for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false  # LFS disabled - we use partitioned API files instead
          fetch-depth: 1
          fetch-tags: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install dependencies
        working-directory: ./website
        run: npm ci

      - name: Build website
        working-directory: ./website
        env:
          VITE_API_BASE_URL: ${{ vars.R2_PUBLIC_BASE_URL }}
        run: npm run build

      - name: Sync API to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REGION: auto
          AWS_EC2_METADATA_DISABLED: true
          AWS_MAX_ATTEMPTS: 5
          AWS_RETRY_MODE: adaptive
        run: |
          if [ ! -d "./website/public/api" ]; then
            echo "ERROR: website/public/api not found"
            ls -la ./website/public || true
            exit 1
          fi
          max_attempts=7
          base_delay=5
          max_delay=120
          for attempt in $(seq 1 $max_attempts); do
            echo "R2 sync attempt ${attempt}/${max_attempts}..."
            if aws s3 sync ./website/public/api s3://${{ vars.R2_BUCKET }}/api --endpoint-url ${{ vars.R2_ENDPOINT }} --delete --only-show-errors --exclude "games/*" --exclude "player_history/*"; then
              exit 0
            fi
            echo "R2 sync attempt ${attempt} failed."
            if [ "$attempt" -lt "$max_attempts" ]; then
              delay=$((base_delay << (attempt - 1)))
              if [ "$delay" -gt "$max_delay" ]; then
                delay=$max_delay
              fi
              jitter=$((RANDOM % 5))
              sleep $((delay + jitter))
            fi
          done
          echo "ERROR: R2 sync failed after retries."
          exit 1

      - name: Remove API from Pages artifact
        run: rm -rf ./website/dist/api ./website/dist/game_history_web.json ./website/dist/player_statistics_web.json ./website/dist/game_history.json ./website/dist/player_statistics.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
